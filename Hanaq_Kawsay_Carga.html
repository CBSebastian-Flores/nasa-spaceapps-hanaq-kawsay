<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANAQ KAWSAY OS | Inicializando Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #02040a;
            color: #00f0ff;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .boot-console {
            font-size: 13px;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            height: 250px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .boot-line {
            margin: 2px 0;
            opacity: 0;
            animation: fadeInBoot 0.1s forwards;
        }

        @keyframes fadeInBoot {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="mb-10 relative w-32 h-32 flex items-center justify-center">
        <!-- Anillos Giratorios -->
        <div class="absolute inset-0 rounded-full border-2 border-dashed border-cyan-500 animate-[spin_4s_linear_infinite] opacity-50"></div>
        <div class="absolute inset-2 rounded-full border-t-2 border-r-2 border-cyan-400 animate-[spin_2s_linear_infinite]"></div>
        <div class="absolute inset-4 rounded-full border-b-2 border-l-2 border-emerald-400 animate-[spin_3s_linear_reverse_infinite] opacity-70"></div>
        <!-- Icono Central -->
        <i class="fa-solid fa-satellite-dish text-4xl text-cyan-400 animate-pulse" style="text-shadow: 0 0 20px #00f0ff"></i>
    </div>

    <div class="boot-console" id="bootConsole">
        <!-- Las líneas se inyectan por JS -->
    </div>

    <div class="mt-8 text-[11px] font-mono text-cyan-500/60 uppercase tracking-[0.4em] animate-pulse">
        Inicializando Entorno de Simulación 3D
    </div>

    <script>
        // Obtener el ID del astronauta de la URL anterior para pasarlo al Dashboard
        const params = new URLSearchParams(window.location.search);
        const astroId = params.get('astro_id') || 'armstrong';

        const consoleEl = document.getElementById('bootConsole');
        
        const bootLines = [
            "> INICIALIZANDO NÚCLEO AERO-MED OS v4.4...",
            "> CARGANDO MÓDULOS DE INTERFAZ HOLOGRÁFICA (THREE.JS)...",
            "> COMPILANDO SHADERS Y MATERIALES PBR...",
            "> CARGANDO RED DE ESTILOS Y ESTÁNDARES NASA...",
            "> ESTABLECIENDO ENLACES DE TELEMETRÍA BIOMÉTRICA...",
            "> PREPARANDO MATRIZ DE DATOS Y LECTURA SENSORIAL...",
            "> SINCRONIZANDO UMBRALES CLÍNICOS NTX/CTX Y RADIACIÓN...",
            "> SISTEMAS NOMINALES AL 100%.",
            "> ABRIENDO PUERTA DE ENLACE AL HUD PRINCIPAL..."
        ];

        let lineIndex = 0;
        
        function printLine() {
            if (lineIndex < bootLines.length) {
                const line = document.createElement('div');
                line.className = 'boot-line';
                line.innerHTML = `<span class="text-emerald-400 font-bold">[OK]</span> ${bootLines[lineIndex]}`;
                consoleEl.appendChild(line);
                lineIndex++;
                
                // Tiempos aleatorios para simular carga real (entre 100ms y 300ms por línea)
                const nextDelay = Math.random() * 200 + 100;
                setTimeout(printLine, nextDelay);
            }
        }

        window.onload = () => {
            // Empezar a imprimir la consola falsa
            printLine();

            // A los 3.5 segundos exactos, redirigir al Dashboard Principal
            setTimeout(() => {
                window.location.href = `Telemetria_Biomedica.html`;
            }, 3500);
        };
    </script>

</body>
</html>
